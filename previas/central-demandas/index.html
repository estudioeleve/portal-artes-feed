:root{--azul:#3554A4;--azul-esc:#26407F;--azul-cl:#EEF2FB;--txt:#23272F;--cinza:#4A4A4A;--mut:#6B7280;--linha:#E3E7EF;--bg:#F5F7FB;--branco:#fff;
--c-azul:#2697D3;--c-verde:#87BC24;--c-lar:#E46611;--c-ama:#FDD800;--raio:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:M,system-ui,sans-serif;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:1.45rem;font-weight:800;color:var(--azul-esc)}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:.95rem;font-weight:700}
.demo{background:#23272F;color:#fff;font-size:.8rem;padding:6px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;position:sticky;top:0;z-index:50}
.demo b{color:var(--c-ama)}
.demo select{max-width:280px;background:#3A3F4A;color:#fff;border:0;border-radius:6px;padding:3px 6px;font-size:.8rem}
.demo button{background:none;border:1px solid #666;color:#ddd;border-radius:6px;padding:2px 8px;font-size:.75rem;cursor:pointer}
.faixa{height:5px;background:linear-gradient(90deg,var(--c-azul) 0 25%,var(--c-verde) 25% 50%,var(--c-ama) 50% 75%,var(--c-lar) 75%)}
.app{display:flex;min-height:calc(100vh - 34px)}
.side{width:250px;background:#fff;border-right:1px solid var(--linha);padding:18px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:34px;height:calc(100vh - 34px);overflow:auto}
.side .logo{width:100%;max-width:200px;margin:4px auto 4px}
.side .sub{font-size:.72rem;text-align:center;color:var(--mut);font-weight:600;letter-spacing:.02em;margin-bottom:12px}
.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;text-decoration:none;color:var(--txt);font-weight:500;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.nav:hover{background:var(--azul-cl)}
.nav.on{background:var(--azul-cl);color:var(--azul);font-weight:700}
.nav .cnt{margin-left:auto;background:var(--c-lar);color:#fff;border-radius:20px;font-size:.72rem;padding:1px 7px;font-weight:700}
.btn-nova{background:var(--azul);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:800;font-size:1rem;cursor:pointer;margin:6px 0 10px;box-shadow:0 3px 0 var(--azul-esc)}
.btn-nova:hover{background:var(--azul-esc)}
.quem{margin-top:auto;border-top:1px solid var(--linha);padding-top:12px;font-size:.82rem}
.quem b{display:block}
main{flex:1;min-width:0;padding:26px 30px 100px;max-width:1180px}
.top-m{display:none}
.bottom{display:none}
.card{background:#fff;border:1px solid var(--linha);border-radius:var(--raio);padding:18px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
.kpi{cursor:pointer;text-align:left;border:1px solid var(--linha);background:#fff;border-radius:var(--raio);padding:14px 16px;transition:.15s;border-left:6px solid var(--k,#ccc)}
.kpi:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(30,40,80,.08)}
.kpi .n{font-size:2rem;font-weight:800;line-height:1.1;color:var(--txt)}
.kpi .l{font-size:.85rem;font-weight:600;color:var(--cinza)}
.kpi .v{font-size:.72rem;color:var(--azul);font-weight:700;margin-top:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.mt{margin-top:18px}.mt2{margin-top:28px}.mb{margin-bottom:12px}
.muted{color:var(--mut);font-size:.85rem}
.btn{border:1px solid var(--linha);background:#fff;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{border-color:var(--azul);color:var(--azul)}
.btn.p{background:var(--azul);border-color:var(--azul);color:#fff}
.btn.p:hover{background:var(--azul-esc);color:#fff}
.btn.p:disabled{opacity:.6;cursor:wait}
.btn.ok{background:#4E7413;border-color:#4E7413;color:#fff}
.btn.sm{min-height:34px;padding:6px 12px;font-size:.85rem}
.btn.lar{background:var(--c-lar);border-color:var(--c-lar);color:#fff}
label.f{display:block;font-weight:700;font-size:.92rem;margin:16px 0 6px}
.hint{font-weight:400;color:var(--mut);font-size:.82rem}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;border:1.5px solid #CBD2DE;border-radius:10px;padding:11px 12px;background:#fff;min-height:46px}
.filewrap{display:inline-flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:100%}.filewrap label{display:inline-flex;align-items:center;gap:6px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #B9C7EA;border-color:var(--azul)}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{flex:1 1 140px;min-width:0;border:1.5px solid #CBD2DE;border-radius:12px;padding:12px;cursor:pointer;display:flex;gap:8px;align-items:center;font-weight:600;background:#fff}
.opt input{width:20px;height:20px;flex:none;accent-color:var(--azul)}
.opt:has(input:checked){border-color:var(--azul);background:var(--azul-cl);color:var(--azul-esc)}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.chk input{width:20px;height:20px;flex:none;accent-color:var(--azul)}
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;border:1.5px solid #CBD2DE;border-radius:12px;padding:10px;max-height:260px;overflow:auto;background:#fff}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:3px 10px;font-size:.78rem;font-weight:700;white-space:nowrap;border:1px solid transparent}
.s-aguardando{background:#FFF6C2;color:#6B5800;border-color:#EBD86A}
.s-andamento{background:#E3F2FB;color:#155E8A;border-color:#9ACDEB}
.s-resposta{background:#FDEBDD;color:#9A430A;border-color:#F2B68A}
.s-resolvida{background:#EDF6DD;color:#43650F;border-color:#B5D77A}
.atr{background:#FDE2E2;color:#A01C1C;border-color:#F3A5A5}
.prog{background:#F1F3F8;color:var(--cinza);border-color:var(--linha)}
.dv{background:#F3EEFB;color:#5B3D99;border-color:#D3C4EF}
table{width:100%;border-collapse:collapse}
.lista .it{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--linha);cursor:pointer;background:#fff}
.lista .it:hover{background:#FAFBFE}
.lista .it:first-child{border-radius:var(--raio) var(--raio) 0 0}
.lista .it:last-child{border-bottom:0;border-radius:0 0 var(--raio) var(--raio)}
.lista{border:1px solid var(--linha);border-radius:var(--raio)}
.num{font-weight:700;color:var(--azul);font-size:.85rem}
.tit{font-weight:700}
.meta{font-size:.8rem;color:var(--mut);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vazio{padding:30px;text-align:center;color:var(--mut)}
.chart .bar{display:grid;grid-template-columns:170px 1fr 34px;gap:8px;align-items:center;font-size:.82rem;margin:6px 0}
.chart .bar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart .trk{background:#F0F2F7;border-radius:6px;height:20px;overflow:hidden}
.chart .fill{height:100%;border-radius:6px;background:var(--azul)}
.chart .vl{font-weight:700;text-align:right}
.meses{display:flex;gap:10px;align-items:flex-end;height:180px;padding-top:10px;border-bottom:1px solid var(--linha)}
.mes{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.mes .pair{display:flex;gap:4px;align-items:flex-end;height:100%}
.mes .b{width:18px;border-radius:5px 5px 0 0;position:relative}
.mes .b span{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:.7rem;font-weight:700}
.mlab{display:flex;gap:10px}.mlab div{flex:1;text-align:center;font-size:.75rem;color:var(--mut);padding-top:4px;text-transform:capitalize}
.leg{display:flex;gap:14px;font-size:.78rem;margin-top:8px;flex-wrap:wrap}.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.filtros{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.filtros label{font-size:.75rem;font-weight:700;color:var(--cinza);display:block;margin-bottom:3px}
.filtros select,.filtros input{min-height:40px;padding:7px 10px;font-size:.88rem}
.info{background:var(--azul-cl);border:1px solid #CBD6F0;color:#25386B;border-radius:12px;padding:10px 14px;font-size:.82rem}
.alerta{background:#FDE2E2;border:1px solid #F3A5A5;color:#8A1717;border-radius:12px;padding:12px 14px;font-weight:600}
.aviso-lar{background:#FDEBDD;border:1px solid #F2B68A;color:#7C3608;border-radius:12px;padding:12px 14px}
.dl{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.dl div span{display:block;font-size:.75rem;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.dl div b{font-weight:600}
.msg{display:flex;gap:10px;margin:14px 0}
.av{width:38px;height:38px;border-radius:50%;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;flex:none}
.bol{background:#F5F7FB;border:1px solid var(--linha);border-radius:4px 14px 14px 14px;padding:10px 14px;flex:1}
.bol .h{font-size:.78rem;color:var(--mut);margin-bottom:3px}
.bol .h b{color:var(--txt)}
.hist li{font-size:.85rem;margin:6px 0;color:var(--cinza)}
.hist{padding-left:18px;margin:8px 0 0}
.anx{display:inline-flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--linha);border-radius:8px;padding:5px 10px;font-size:.82rem;margin:4px 6px 0 0}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--linha);margin:16px 0}
.tab{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--azul);border-color:var(--azul)}
.tbl td,.tbl th{padding:10px 8px;border-bottom:1px solid var(--linha);text-align:left;font-size:.88rem;vertical-align:middle}
.tbl th{font-size:.75rem;color:var(--mut);text-transform:uppercase}
.inativo{opacity:.5}
.modal-bg{position:fixed;inset:0;background:rgba(20,25,40,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:16px;max-width:460px;width:100%;padding:22px}
.login{min-height:calc(100vh - 34px);display:flex;align-items:center;justify-content:center;padding:20px}
.login .card{max-width:420px;width:100%;padding:28px}
.login .logo{width:240px;display:block;margin:0 auto 6px}
.ok-box{text-align:center;padding:36px 20px}
.ok-box .ic{width:70px;height:70px;border-radius:50%;background:#EDF6DD;color:#43650F;display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 12px;font-weight:800}
.entrega{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.entrega img.foto{width:120px;height:90px;object-fit:cover;border-radius:10px}
.secl{height:46px;max-width:220px;object-fit:contain}
.proglogo{height:56px;max-width:150px;object-fit:contain}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#23272F;color:#fff;padding:10px 18px;border-radius:10px;z-index:200;font-size:.9rem}
.flag{font-size:.7rem;font-weight:800;color:#fff;background:var(--c-lar);border-radius:6px;padding:2px 6px;margin-left:6px}
@media(max-width:900px){
 .demo{position:static;font-size:.72rem;padding:5px 10px;gap:6px}
 .demo select{max-width:200px}
 .side{display:none}
 .top-m{display:flex;align-items:center;gap:10px;background:#fff;border-bottom:1px solid var(--linha);padding:8px 14px;position:sticky;top:0;z-index:40}
 .top-m img{height:40px}
 .top-m .sp{flex:1}
 .bell{position:relative;border:0;background:var(--azul-cl);border-radius:10px;width:44px;height:44px;font-size:1.2rem;cursor:pointer}
 .bell .cnt{position:absolute;top:-4px;right:-4px;background:var(--c-lar);color:#fff;border-radius:20px;font-size:.68rem;padding:1px 6px;font-weight:800}
 main{padding:16px 14px 110px}
 .bottom{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--linha);z-index:40;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bottom button{flex:1;border:0;background:none;font-size:.7rem;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;cursor:pointer;min-height:48px}
 .bottom button .i{font-size:1.25rem;line-height:1}
 .bottom button.on{color:var(--azul)}
 .bottom .nv{background:var(--azul);color:#fff!important;border-radius:14px;margin:0 4px;font-weight:800}
 .g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}
 .filtros{grid-template-columns:repeat(2,1fr)}
 .opt{flex:1 1 calc(50% - 5px);padding:12px 10px;font-size:.92rem}
 .dl{grid-template-columns:1fr 1fr}
 .lista .it{grid-template-columns:1fr;gap:6px}
 .chart .bar{grid-template-columns:110px 1fr 28px}
 .kpi .n{font-size:1.6rem}
 h1{font-size:1.25rem}
}
</style>
</head>

 :`<label class="f">Para quem? *</label><div class="opts"><label class="opt"><input type="radio" name="dst" value="prefeito" required> Prefeito</label><label class="opt"><input type="radio" name="dst" value="comunicacao"> Comunicação</label><label class="opt"><input type="radio" name="dst" value="ambos"> Os dois</label></div>`}
 <label class="f">Programa de governo <span class="hint">(opcional)</span></label><select id="np"><option value="">Nenhum</option>${D.progs.filter(p=>p.ativo).map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select>

function initNova(){const r=document.querySelector('input[name=dst]:checked');const b=document.getElementById('boxsec');if(b)b.style.display=r&&r.value==='secretaria'?'':'none'}
function enviar(){
 if(S.sending)return;const err=m=>document.getElementById('nerr').textContent=m;
 const t=nt.value.trim(),ds=nd.value.trim(),dst=document.querySelector('input[name=dst]:checked')?.value;
 const sem=nsz.checked,pz=nz.value;
 if(!dst)return err('Escolha para quem é o pedido.');
 if(!sem&&!pz)return err('Informe o prazo desejado ou marque "Sem data definida".');
 let alvos=[null];
 if(dst==='secretaria'){alvos=[...document.querySelectorAll('.cs:checked')].map(c=>c.value);if(!alvos.length)return err('Escolha ao menos uma secretaria.')}
 S.sending=true;nbtn.disabled=true;nbtn.textContent='Enviando…';
 const f=na.files[0];const anx=f?[{nome:f.name,tam:Math.max(1,Math.round(f.size/1024))+' KB',autorId:S.user.id,em:Date.now()}]:[];
 setTimeout(()=>{
  const nums=[];
  alvos.forEach(sid=>{
   const u=S.user;const d={id:uid(),numero:'',titulo:t,descricao:ds,autorId:u.id,origemSec:u.perfil==='secretaria'?u.secId:null,destino:dst,secIds:[],comAcesso:dst==='comunicacao'||dst==='ambos',progId:np.value||null,
    prazoDesejado:sem?null:new Date(pz+'T00:00').getTime(),prazoCombinado:null,situacao:'aguardando',aguardandoDe:'',criadaEm:Date.now(),concluidaEm:null,entrega:'',divulgacao:null,foto:null,mensagens:[],anexos:anx.slice(),historico:[],reabertura:null,respId:null};
   if(d.origemSec)d.secIds.push(d.origemSec);if(sid)d.secIds.push(sid);
   d.respId=dst==='secretaria'?D.users.find(x=>x.secId===sid&&x.ativo)?.id:dst==='prefeito'?'u2':'u3';
   D.seq++;d.numero='SL-'+new Date().getFullYear()+'-'+String(D.seq).padStart(4,'0');
   d.historico.push({em:Date.now(),autorId:u.id,texto:'Pedido criado e enviado para '+destTxt(d)});
   D.dem.push(d);notify(d,'Novo pedido '+d.numero+': '+t);nums.push(d);
  });
  save();S.ultimo=nums;S.sending=false;go('enviado');
 },500);
}

function telaLista(){
 const f=S.lf;const v=visiveis();const vt=S.user.perfil!=='secretaria';
 let a=v.filter(d=>{
  if(f.q){const q=f.q.toLowerCase();if(!(d.titulo+' '+d.descricao+' '+d.numero).toLowerCase().includes(q))return false}
  if(f.sec&&!d.secIds.includes(f.sec))return false;if(f.dest&&d.destino!==f.dest)return false;if(f.prog&&d.progId!==f.prog)return false;
  const per=f.per||'tudo';const ref=f.base==='concluidas'?d.concluidaEm:d.criadaEm;if(f.sit!=='atrasada'&&f.sit!=='decisao'&&(!ref||!noPer(ref,per)))return false;
  if(f.sit==='atrasada')return atrasada(d);if(f.sit==='decisao')return d.situacao==='resposta'&&d.aguardandoDe==='Prefeito';
  if(f.sit==='abertas')return d.situacao!=='resolvida';if(f.sit==='divulgar')return d.situacao==='resolvida'&&d.divulgacao==='avaliar';
  if(f.sit)return d.situacao===f.sit;return true}).sort((x,y)=>y.criadaEm-x.criadaEm);
 const set=(k)=>`onchange="S.lf.${k}=this.value;route()"`;
 return `<div class="row mb"><h1>Demandas</h1><div class="sp"></div><span class="muted">${a.length} pedido(s)</span></div>

 ${vt?`<div><label>Secretaria</label><select ${set('sec')}><option value="">Todas</option>${D.secs.filter(s=>s.ativo).map(s=>`<option value="${s.id}" ${f.sec===s.id?'selected':''}>${esc(s.nome)}</option>`).join('')}</select></div>`:''}
 <div><label>Destino</label><select ${set('dest')}><option value="">Todos</option>${Object.entries(DEST).map(([k,t])=>`<option value="${k}" ${f.dest===k?'selected':''}>${t}</option>`).join('')}</select></div>
 <div><label>Programa</label><select ${set('prog')}><option value="">Todos</option>${D.progs.map(p=>`<option value="${p.id}" ${f.prog===p.id?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></div>
 <div><label>Período ${f.base==='concluidas'?'(conclusão)':'(criação)'}</label><select ${set('per')}>${[['tudo','Tudo'],['30','Últimos 30 dias'],['90','Últimos 90 dias'],['180','Últimos 6 meses'],['ano','Este ano']].map(([k,t])=>`<option value="${k}" ${(f.per||'tudo')===k?'selected':''}>${t}</option>`).join('')}</select></div>
 </div>${Object.values(f).some(Boolean)?`<button class="btn sm" style="margin-top:10px" onclick="S.lf={};route()">Limpar filtros</button>`:''}</div>
 <div class="mt">${lista(a,'Nenhum pedido encontrado com esses filtros.')}</div>`;
}

 D.notif.forEach(n=>{if(n.userId===u.id&&n.demId===d.id)n.lida=true});save();
 const decisao=d.situacao==='resposta'&&d.aguardandoDe==='Prefeito'&&u.perfil==='prefeito';
 const timeline=d.mensagens.map(m=>{const a=U(m.autorId);return `<div class="msg"><div class="av" style="background:${a.perfil==='prefeito'?'#E46611':a.perfil==='comunicacao'?'#2697D3':'#3554A4'}">${ini(a.nome)}</div><div class="bol"><div class="h"><b>${esc(a.nome)}</b> · ${a.perfil==='secretaria'?esc(SEC(a.secId).nome):PERFIL[a.perfil]} · ${fdh(m.em)}</div>${esc(m.texto).replace(/\n/g,'<br>')}${m.anexos.map(x=>`<div><span class="anx">📎 ${esc(x.nome)} <span class="muted">${x.tam}</span></span></div>`).join('')}</div></div>`}).join('');

 return `<button class="btn sm mb" onclick="history.length>1?history.back():go('demandas')">← Voltar</button>

 <div class="dl"><div><span>Solicitante</span><b>${esc(U(d.autorId).nome)}</b><div class="muted">${esc(origemTxt(d))}</div></div><div><span>Destino</span><b>${esc(destTxt(d))}</b></div><div><span>Responsável pelo atendimento</span><b>${esc(resp?.nome||'—')}</b><div class="muted">${resp?(resp.perfil==='secretaria'?esc(SEC(resp.secId).nome):PERFIL[resp.perfil]):''}</div></div>
 <div><span>Criado em</span><b>${fdh(d.criadaEm)}</b></div><div><span>Prazo desejado</span><b>${d.prazoDesejado?fd(d.prazoDesejado):'Sem data definida'}</b></div><div><span>Prazo combinado</span><b>${d.prazoCombinado?fd(d.prazoCombinado):'Ainda não combinado'}</b></div></div></div>
 ${at?painelAtend(d):''}

function painelAtend(d){
 const resolvida=d.situacao==='resolvida';
 const alvos=[['u2','Prefeito'],['u3','Comunicação']].concat(D.secs.filter(s=>s.ativo).map(s=>{const r=D.users.find(u=>u.secId===s.id&&u.ativo);return r?[r.id,'Secretaria de '+s.nome]:null}).filter(Boolean)).filter(x=>x[0]!==d.respId);
 if(resolvida)return `<div class="card mt" style="border-color:#9ACDEB"><h2>Atendimento</h2><p class="muted">Pedido concluído. Se for preciso, reabra informando o motivo.</p><textarea id="ramot" placeholder="Motivo da reabertura"></textarea><button class="btn lar mt" onclick="reabrir('${d.id}')">Reabrir pedido</button></div>`;
 return `<div class="card mt" style="border-color:#9ACDEB;background:#FBFDFF"><h2>Atendimento <span class="hint">— você é o responsável${S.user.perfil==='admin'&&d.respId!==S.user.id?' (como administrador)':''}</span></h2>
 <div class="grid g3 mt" style="margin-top:12px">
 <div><label class="f" style="margin-top:0">Mudar situação</label><select id="asit" onchange="document.getElementById('bde').style.display=this.value==='resposta'?'':'none';document.getElementById('bfim').style.display=this.value==='resolvida'?'':'none'">${Object.entries(SIT).map(([k,v])=>`<option value="${k}" ${d.situacao===k?'selected':''}>${v.i} ${v.t}</option>`).join('')}</select>
 <div id="bde" style="display:${d.situacao==='resposta'?'':'none'}"><label class="f">Aguardando resposta de quem?</label><select id="ade">${['Prefeito','Solicitante','Comunicação','Outra secretaria'].map(x=>`<option ${d.aguardandoDe===x?'selected':''}>${x}</option>`).join('')}</select></div>
 <div id="bfim" style="display:none"><label class="f">O que foi entregue? *</label><textarea id="aent" placeholder="Descreva a entrega (obrigatório)"></textarea><label class="f">Foto da entrega <span class="hint">(opcional)</span></label><span class="filewrap"><label class="btn sm">📎 Escolher arquivo<input type="file" accept="image/*" id="afoto" hidden onchange="this.closest('.filewrap').querySelector('.fn').textContent=this.files[0]?this.files[0].name:'Nenhum arquivo escolhido'"></label> <span class="fn muted">Nenhum arquivo escolhido</span></span></div>
 <button class="btn p mt" style="margin-top:10px" onclick="mudarSit('${d.id}')">Atualizar situação</button></div>
 <div><label class="f" style="margin-top:0">Prazo combinado</label><input type="date" id="apz" value="${d.prazoCombinado?new Date(d.prazoCombinado).toISOString().slice(0,10):''}"><button class="btn mt" style="margin-top:10px" onclick="setPrazo('${d.id}')">Salvar prazo</button></div>
 <div><label class="f" style="margin-top:0">Encaminhar para</label><select id="aenc">${alvos.map(([i,t])=>`<option value="${i}">${esc(t)}</option>`).join('')}</select><button class="btn mt" style="margin-top:10px" onclick="encaminhar('${d.id}')">Encaminhar</button></div>
 </div></div>`;
}
function hist(d,t){d.historico.push({em:Date.now(),autorId:S.user.id,texto:t})}
function mudarSit(id){const d=D.dem.find(x=>x.id===id);const s=asit.value;
 if(s==='resolvida'){const e=aent.value.trim();if(!e){toast('Descreva a entrega para concluir.');aent.focus();return}
  const fin=foto=>{d.situacao='resolvida';d.entrega=e;d.concluidaEm=Date.now();d.foto=foto;d.divulgacao='avaliar';d.reabertura=null;hist(d,'Pedido concluído. Entrega: '+e);notify(d,d.numero+' foi resolvido: '+e);
   D.users.filter(u=>u.perfil==='comunicacao'&&u.ativo&&u.id!==S.user.id&&!pode(d,u)).forEach(u=>{});d.comAcesso=true;
   D.users.filter(u=>u.perfil==='comunicacao'&&u.ativo&&u.id!==S.user.id).forEach(u=>D.notif.unshift({id:uid(),userId:u.id,demId:d.id,texto:'Pronto para divulgar: '+d.titulo,em:Date.now(),lida:false}));
   save();route()};
  const f=afoto.files[0];if(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');const k=Math.min(1,900/im.width);c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);fin(c.toDataURL('image/jpeg',.75))};im.src=r.result};r.readAsDataURL(f)}else fin(null);return}
 if(s===d.situacao&&!(s==='resposta'&&ade.value!==d.aguardandoDe)){toast('A situação já é essa.');return}
 d.situacao=s;d.aguardandoDe=s==='resposta'?ade.value:'';hist(d,'Situação alterada para "'+SIT[s].t+'"'+(s==='resposta'?' (de: '+d.aguardandoDe+')':''));notify(d,d.numero+': situação agora é '+SIT[s].t);save();route()}
function setPrazo(id){const d=D.dem.find(x=>x.id===id);const v=apz.value;d.prazoCombinado=v?new Date(v+'T00:00').getTime():null;hist(d,v?'Prazo combinado definido: '+fd(d.prazoCombinado):'Prazo combinado removido');notify(d,d.numero+': prazo combinado '+(v?fd(d.prazoCombinado):'removido'));save();route()}
function encaminhar(id){const d=D.dem.find(x=>x.id===id);const nu=U(aenc.value);const ant=U(d.respId);d.respId=nu.id;
 if(nu.perfil==='secretaria'&&!d.secIds.includes(nu.secId))d.secIds.push(nu.secId);if(nu.perfil==='comunicacao')d.comAcesso=true;
 hist(d,'Encaminhado de '+ant.nome+' para '+nu.nome+(nu.perfil==='secretaria'?' (Secretaria de '+SEC(nu.secId).nome+')':''));notify(d,d.numero+' foi encaminhado para '+nu.nome);save();toast('Pedido encaminhado');route()}
function reabrir(id){const d=D.dem.find(x=>x.id===id);const m=ramot.value.trim()||d.reabertura?.motivo;if(!m){toast('Informe o motivo da reabertura.');return}
 hist(d,'Pedido reaberto. Motivo: '+m+' (entrega anterior: '+d.entrega+')');d.situacao='andamento';d.concluidaEm=null;d.entrega='';d.foto=null;d.divulgacao=null;d.reabertura=null;notify(d,d.numero+' foi reaberto');save();route()}
function pedirReab(id){const d=D.dem.find(x=>x.id===id);const m=rmot.value.trim();if(!m){toast('Informe o motivo.');return}d.reabertura={motivo:m,autorId:S.user.id,em:Date.now()};hist(d,'Reabertura solicitada: '+m);notify(d,'Pedido de reabertura em '+d.numero);save();route()}
function setDiv(id,k){const d=D.dem.find(x=>x.id===id);d.divulgacao=k;hist(d,DIV[k]);save();route()}
function mandar(id){const d=D.dem.find(x=>x.id===id);const t=mtx.value.trim();const f=mfx.files[0];if(!t&&!f)return;mbtn.disabled=true;
 d.mensagens.push({autorId:S.user.id,texto:t,em:Date.now(),anexos:f?[{nome:f.name,tam:Math.max(1,Math.round(f.size/1024))+' KB'}]:[]});notify(d,'Nova mensagem em '+d.numero+' de '+S.user.nome);save();route()}

/* ---------- ENTREGAS ---------- */
function telaEntregas(){
 const a=visiveis().filter(d=>d.situacao==='resolvida').sort((x,y)=>y.concluidaEm-x.concluidaEm);
 const h=hoje0();const sem=a.filter(d=>d.concluidaEm>=h-7*DIA).length;
 return `<h1>Entregas realizadas</h1><p class="muted">O que as secretarias concluíram, da mais recente para a mais antiga.</p>
 <div class="grid g3 mt"><div class="kpi" style="--k:#87BC24;cursor:default"><div class="n">${a.filter(d=>d.concluidaEm>=h).length}</div><div class="l">Hoje</div></div><div class="kpi" style="--k:#87BC24;cursor:default"><div class="n">${sem}</div><div class="l">Últimos 7 dias</div></div><div class="kpi" style="--k:#5B3D99" onclick='abrirLista({sit:"divulgar"})'><div class="n">${a.filter(d=>d.divulgacao==='avaliar').length}</div><div class="l">Aguardando avaliação de divulgação</div><div class="v">Ver lista →</div></div></div>
 <div class="mt">${a.length?a.map(d=>`<div class="card entrega" style="margin-bottom:10px;cursor:pointer" onclick="go('pedido-${d.id}')">${d.foto?`<img class="foto" src="${d.foto}" alt="">`:`<div class="av" style="background:#87BC24;width:48px;height:48px;font-size:1.3rem">✓</div>`}<div><div class="row"><span class="num">${d.numero}</span>${bProg(d)}${d.divulgacao?`<span class="badge dv">📣 ${DIV[d.divulgacao]}</span>`:''}<div class="sp"></div><span class="muted">${fdh(d.concluidaEm)}</span></div><div class="tit" style="margin-top:4px">${esc(d.titulo)}</div><div>${esc(d.entrega)}</div><div class="meta">${esc(U(d.respId)?.nome||'')} · ${esc(origemTxt(d))} → ${esc(destTxt(d))}</div></div></div>`).join(''):'<div class="card vazio">Nenhuma entrega ainda.</div>'}</div>`;
}

/* ---------- AVISOS ---------- */
function telaAvisos(){const n=minhasNotif();
 return `<div class="row mb"><h1>Avisos</h1><div class="sp"></div>${n.some(x=>!x.lida)?`<button class="btn sm" onclick="minhasNotif().forEach(x=>x.lida=true);save();route()">Marcar todos como lidos</button>`:''}</div>
 <p class="muted mb">Você recebe avisos apenas dos pedidos que pode acessar: novos pedidos, mensagens e mudanças de situação.</p>
 ${n.length?`<div class="lista">${n.map(x=>`<div class="it" style="grid-template-columns:20px 1fr auto" onclick="go('pedido-${x.demId}')"><div>${x.lida?'':'<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c-lar)"></span>'}</div><div style="${x.lida?'':'font-weight:700'}">${esc(x.texto)}</div><div class="muted">${fdh(x.em)}</div></div>`).join('')}</div>`:'<div class="card vazio">Nenhum aviso por enquanto. Crie um pedido e troque de perfil no topo para ver o aviso chegando.</div>'}`}

/* ---------- ADMINISTRAÇÃO ---------- */
function telaAdmin(){const t=S.adminTab;
 return `<h1>Administração</h1><div class="tabs">${[['usuarios','Usuários'],['secretarias','Secretarias e setores'],['programas','Programas']].map(([k,l])=>`<button class="tab ${t===k?'on':''}" onclick="S.adminTab='${k}';route()">${l}</button>`).join('')}</div>
 ${t==='usuarios'?admUsers():t==='secretarias'?admSecs():admProgs()}`}
function admUsers(){
 return `<div class="row mb"><p class="muted" style="margin:0">Não existe cadastro público: só o administrador cria acessos. Cada secretaria tem um responsável ativo.</p><div class="sp"></div><button class="btn p" onclick="modalUser()">+ Novo usuário</button></div>
 <div class="card" style="overflow:auto"><table class="tbl"><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Secretaria</th><th>Situação</th><th></th></tr>
 ${D.users.slice().sort((a,b)=>(b.ativo-a.ativo)).map(u=>`<tr class="${u.ativo?'':'inativo'}"><td><b>${esc(u.nome)}</b></td><td>${esc(u.email)}</td><td>${PERFIL[u.perfil]}</td><td>${u.secId?esc(SEC(u.secId).nome):'—'}</td><td>${u.ativo?'<span class="badge s-resolvida">Ativo</span>':`<span class="badge prog">Desativado${u.desativadoEm?' em '+fd(u.desativadoEm):''}</span>`}</td><td>${u.perfil==='secretaria'&&u.ativo?`<button class="btn sm" onclick="modalUser('${u.secId}')">Substituir</button>`:''}${!u.ativo&&u.perfil!=='secretaria'?`<button class="btn sm" onclick="U('${u.id}').ativo=true;save();route()">Reativar</button>`:''}${u.ativo&&u.perfil==='comunicacao'?`<button class="btn sm" onclick="U('${u.id}').ativo=false;save();route()">Desativar</button>`:''}</td></tr>`).join('')}</table></div>`}
function modalUser(secId){
 const m=document.getElementById('modal');
 m.innerHTML=`<div class="modal-bg" onclick="if(event.target===this)this.parentNode.innerHTML=''"><form class="modal" onsubmit="event.preventDefault();salvarUser()"><h2>${secId?'Substituir responsável':'Novo usuário'}</h2>
 <label class="f">Nome completo</label><input type="text" id="unome" required><label class="f">E-mail</label><input type="email" id="uemail" required>
 <label class="f">Perfil</label><select id="uperf" onchange="ubsec.style.display=this.value==='secretaria'?'':'none'" ${secId?'disabled':''}>${Object.entries(PERFIL).filter(([k])=>k!=='admin'||1).map(([k,t])=>`<option value="${k}" ${(secId?'secretaria':'secretaria')===k?'selected':''}>${t}</option>`).join('')}</select>
 <div id="ubsec"><label class="f">Secretaria</label><select id="usec" ${secId?'disabled':''}>${D.secs.filter(s=>s.ativo).map(s=>`<option value="${s.id}" ${secId===s.id?'selected':''}>${esc(s.nome)}</option>`).join('')}</select></div>
 <div class="info mt">Se a secretaria já tiver um responsável, o acesso anterior será <b>desativado</b> e o histórico dele, preservado. Os pedidos em aberto passam para o novo responsável. Na versão final, a pessoa recebe um e-mail para criar a própria senha.</div>
 <div class="row mt"><div class="sp"></div><button type="button" class="btn" onclick="document.getElementById('modal').innerHTML=''">Cancelar</button><button class="btn p">Salvar</button></div></form></div>`}
function salvarUser(){const p=uperf.value,sid=p==='secretaria'?usec.value:null;const e=uemail.value.trim().toLowerCase();
 if(D.users.some(u=>u.email===e)){toast('Já existe um usuário com esse e-mail.');return}
 const nu={id:uid(),nome:unome.value.trim(),email:e,perfil:p,secId:sid,ativo:true};
 if(sid){const ant=D.users.find(u=>u.secId===sid&&u.ativo);if(ant){ant.ativo=false;ant.desativadoEm=Date.now();D.dem.filter(d=>d.respId===ant.id&&d.situacao!=='resolvida').forEach(d=>{d.respId=nu.id;hist(d,'Responsável da secretaria substituído: '+ant.nome+' → '+nu.nome)})}}
 D.users.push(nu);save();document.getElementById('modal').innerHTML='';toast('Usuário cadastrado');route()}
function admSecs(){
 return `<div class="row mb"><p class="muted" style="margin:0">Setores desativados não aparecem nos formulários. O histórico é mantido.</p><div class="sp"></div><button class="btn p" onclick="novoSetor()">+ Novo setor</button></div>
 <div class="card" style="overflow:auto"><table class="tbl"><tr><th>Setor</th><th>Responsável ativo</th><th>Situação</th><th></th></tr>${D.secs.map(s=>{const r=D.users.find(u=>u.secId===s.id&&u.ativo);return `<tr class="${s.ativo?'':'inativo'}"><td><b>${esc(s.nome)}</b></td><td>${r?esc(r.nome):'<span class="muted">—</span>'}</td><td>${s.ativo?'<span class="badge s-resolvida">Ativo</span>':'<span class="badge prog">Disponível para ativação</span>'}</td><td class="row"><button class="btn sm" onclick="editarSetor('${s.id}')">Editar</button><button class="btn sm" onclick="SEC('${s.id}').ativo=!SEC('${s.id}').ativo;save();route()">${s.ativo?'Desativar':'Ativar'}</button></td></tr>`}).join('')}</table></div>`}
function modalTexto(tit,val,cb){window._cb=cb;document.getElementById('modal').innerHTML=`<div class="modal-bg"><form class="modal" onsubmit="event.preventDefault();_cb(mtxt.value.trim());document.getElementById('modal').innerHTML=''"><h2>${tit}</h2><input type="text" id="mtxt" required value="${esc(val)}" style="margin-top:12px"><div class="row mt"><div class="sp"></div><button type="button" class="btn" onclick="document.getElementById('modal').innerHTML=''">Cancelar</button><button class="btn p">Salvar</button></div></form></div>`;mtxt.focus()}
function novoSetor(){modalTexto('Novo setor','',v=>{D.secs.push({id:uid(),nome:v,ativo:true});save();route()})}
function editarSetor(id){modalTexto('Editar setor',SEC(id).nome,v=>{SEC(id).nome=v;save();route()})}
function admProgs(){
 return `<div class="row mb"><p class="muted" style="margin:0">Programas e pacotes de benefícios do governo. Os pedidos podem ser ligados a eles e o painel mostra o andamento de cada um.</p><div class="sp"></div><button class="btn p" onclick="modalTexto('Novo programa','',v=>{D.progs.push({id:uid(),nome:v,ativo:true});save();route()})">+ Novo programa</button></div>
 <div class="grid g3">${D.progs.map(p=>`<div class="card ${p.ativo?'':'inativo'}"><div class="row"><img class="proglogo" src="${A[p.logo]||A.HEART}" alt=""><div class="sp"></div>${p.ativo?'<span class="badge s-resolvida">Ativo</span>':'<span class="badge prog">Inativo</span>'}</div><h3 class="mt" style="margin-top:10px">${esc(p.nome)}</h3><p class="muted">${D.dem.filter(d=>d.progId===p.id).length} pedidos ligados</p><div class="row"><button class="btn sm" onclick="modalTexto('Editar programa',PROG('${p.id}').nome,v=>{PROG('${p.id}').nome=v;save();route()})">Editar</button><button class="btn sm" onclick="PROG('${p.id}').ativo=!PROG('${p.id}').ativo;save();route()">${p.ativo?'Desativar':'Ativar'}</button></div></div>`).join('')}</div>`}

/* ---------- MEU ACESSO ---------- */
function telaAcesso(){const u=S.user;
 return `<h1>Meu acesso</h1><div class="card mt"><div class="dl"><div><span>Nome</span><b>${esc(u.nome)}</b></div><div><span>E-mail</span><b>${esc(u.email)}</b></div><div><span>Perfil</span><b>${PERFIL[u.perfil]}</b></div>${u.secId?`<div><span>Secretaria</span><b>${esc(SEC(u.secId).nome)}</b></div>`:''}</div></div>
 <form class="card mt" onsubmit="event.preventDefault();this.querySelector('.info').style.display='block';this.reset()"><h2>Trocar senha</h2><label class="f">Senha atual</label><input type="password" required><label class="f">Nova senha <span class="hint">(mínimo 8 caracteres)</span></label><input type="password" minlength="8" required><button class="btn p mt">Salvar nova senha</button><div class="info mt" style="display:none"><b>Prévia:</b> nesta demonstração a senha não é gravada. Na versão final, a troca é feita no servidor de autenticação.</div></form>
 ${u.perfil==='admin'?`<button class="btn mt" style="width:100%" onclick="go('admin')">⚙ Administração</button>`:''}
 <button class="btn mt" style="width:100%" onclick="entrar('')">Sair</button>`}

load();route();
</script>
</body>
</html>
