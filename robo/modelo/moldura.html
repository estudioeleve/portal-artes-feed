<!doctype html><html><head><meta charset=utf8><style>
@font-face{font-family:RB;font-weight:700;src:url(../fonts/roboto-latin-700-normal.woff2)}
@font-face{font-family:RB;font-weight:700;src:url(../fonts/roboto-latin-ext-700-normal.woff2);unicode-range:U+0100-024F}
@font-face{font-family:PP;font-weight:400;src:url(../fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:PP;font-weight:700;src:url(../fonts/poppins-latin-700-normal.woff2)}
*{margin:0;box-sizing:border-box}body{background:#fff}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;background:#fff}
.foto{position:absolute;inset:0;background-size:cover;background-position:center 25%}
.gr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 33.3%,rgba(0,0,0,0.04) 44.4%,rgba(0,0,0,0.15) 53.3%,rgba(0,0,0,0.32) 60.7%,rgba(0,0,0,0.5) 66.7%,rgba(0,0,0,0.68) 72.6%,rgba(0,0,0,0.86) 79.3%,rgba(0,0,0,0.95) 85.9%,rgba(0,0,0,0.99) 92.6%,rgba(0,0,0,1) 100.0%)}
.tab{position:absolute;left:72px;top:0;width:66px;height:420px;background:linear-gradient(180deg,#00238A,#06153E);box-shadow:-3px 0 0 rgba(255,255,255,.08) inset,0 6px 14px rgba(0,0,0,.25)}
.lg{position:absolute;left:50%;bottom:44px;transform-origin:0 0;transform:rotate(-90deg) translate(0,-50%);display:flex;align-items:baseline;gap:7px;white-space:nowrap}
.lg img{display:block}.lg span{font:400 27px/1 PP;color:#fff;letter-spacing:-.01em;position:relative;top:1px}
.tab.politica{background:linear-gradient(180deg,#2A2A2A,#050505)}
.txt{position:absolute;left:108px;top:887px;width:868px;color:#fff}
.ed{font:700 40px/.99 RB;letter-spacing:-.062em;text-transform:uppercase;height:90px}
.ti{font:700 60px/1.11 RB;letter-spacing:-.05em}
.rod{position:absolute;right:66px;bottom:72px;color:#fff;font:400 21px PP}
.rod b{font-weight:700}
</style></head><body><section class="s" id="arte">
<div class="foto" id="foto"></div><div class="gr"></div>
<div class="tab" id="tab"><div class="lg" id="lg"><img src="portal.png" style="height:29px"><img src="one.png" style="height:17px"><img src="news.png" style="height:17px"></div></div>
<div class="txt"><div class="ed" id="ed">BRASIL</div><div class="ti" id="ti">Título</div></div>
<div class="rod">acesse o nosso site <b>www.portalonenews.com.br</b></div>
</section>
<script>
const q=new URLSearchParams(location.search);
if(q.get('ed'))document.getElementById('ed').textContent=q.get('ed');
if(q.get('ti'))document.getElementById('ti').textContent=q.get('ti');
if(q.get('foto'))document.getElementById('foto').style.backgroundImage='url("'+q.get('foto')+'")';
const portal=q.get('portal')||'one';
if(portal!=='one'){const nome=portal==='luziense'?'luziense':'política';document.getElementById('lg').innerHTML='<img src="portal.png" style="height:29px"><span>'+nome+'</span>';if(portal==='politica')document.getElementById('tab').classList.add('politica');}
// título: até 3 linhas; reduz se passar
const t=document.getElementById('ti');let fs=60;
while(t.scrollHeight>fs*1.11*3+4&&fs>46){fs-=2;t.style.fontSize=fs+'px'}
document.body.dataset.linhas=Math.round(t.scrollHeight/(fs*1.11));
</script></body></html>
