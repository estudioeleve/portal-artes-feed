<!doctype html><html><head><meta charset=utf8><style>
@font-face{font-family:RB;font-weight:700;src:url(../fonts/roboto-latin-700-normal.woff2)}
@font-face{font-family:RB;font-weight:700;src:url(../fonts/roboto-latin-ext-700-normal.woff2);unicode-range:U+0100-024F}
@font-face{font-family:PP;font-weight:400;src:url(../fonts/poppins-latin-400-normal.woff2)}
@font-face{font-family:PP;font-weight:700;src:url(../fonts/poppins-latin-700-normal.woff2)}
*{margin:0;box-sizing:border-box}html,body{background:transparent}
/* Moldura de Reels do Portal Luziense (Canva "REELS LUZIENSE", canva.link/os103tnzgm6mzyt), 1080x1920, fundo transparente */
.s{position:relative;width:1080px;height:1920px;overflow:hidden;background:transparent}
.gr{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 38%,rgba(0,0,0,.12) 48%,rgba(0,0,0,.35) 56%,rgba(0,0,0,.6) 64%,rgba(0,0,0,.82) 72%,rgba(0,0,0,.95) 82%,#000 100%)}
.tab{position:absolute;left:72px;top:0;width:70px;height:700px;background:linear-gradient(180deg,#00238A,#06153E);box-shadow:0 6px 14px rgba(0,0,0,.25)}
.lg{position:absolute;left:50%;bottom:46px;transform-origin:0 0;transform:rotate(-90deg) translate(0,-50%);display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.lg img{display:block;height:31px}.lg span{font:400 29px/1 PP;color:#fff;letter-spacing:-.01em;position:relative;top:1px}
.txt{position:absolute;left:108px;top:1240px;width:880px;color:#fff}
.ed{font:700 42px/1 RB;letter-spacing:-.05em;text-transform:uppercase;margin-bottom:34px}
.ti{font:700 64px/1.12 RB;letter-spacing:-.045em}
.rod{position:absolute;right:72px;top:1672px;color:#fff;font:400 22px PP}.rod b{font-weight:700}
</style></head><body><section class="s" id="arte"><div class="gr"></div>
<div class="tab"><div class="lg" id="lg"><img src="portal.png"><span>luziense</span></div></div>
<div class="txt"><div class="ed" id="ed">SANTA LUZIA</div><div class="ti" id="ti">Título</div></div>
<div class="rod">acesse o nosso site <b>www.portalonenews.com.br</b></div></section>
<script>const q=new URLSearchParams(location.search);
/* portal=one: moldura Canva "REELS ONE NEWS" (canva.link/4k8klc77od955qf), mesma faixa azul com "Portal one news" */
if(q.get('portal')==='one')lg.innerHTML='<img src="portal.png" style="height:31px"><img src="one.png" style="height:19px"><img src="news.png" style="height:19px">';
if(q.get('ed'))ed.textContent=q.get('ed');if(q.get('ti'))ti.textContent=q.get('ti');
let fs=64;while(ti.scrollHeight>fs*1.12*3+4&&fs>48){fs-=2;ti.style.fontSize=fs+'px'}
document.body.dataset.linhas=Math.round(ti.scrollHeight/(fs*1.12));</script></body></html>
